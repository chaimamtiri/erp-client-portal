<app-breadcrumb [items]="['BREADCRUMB.ACCUEIL', 'BREADCRUMB.SUPPORT_TICKET']" />
    <mat-card class="support-card">
      <div class="support-card__header">
        <div>
          <h2>{{ 'SUPPORT.TITLE' | translate }}</h2>
          <p>{{ 'SUPPORT.DESCRIPTION' | translate }}</p>
        </div>
        <button mat-flat-button color="primary">{{ 'SUPPORT.NEW_TICKET' | translate }}</button>
      </div>
      <div class="ticket-list">
        @for (ticket of ticketList(); track ticket.id) {
          <div class="ticket-item">
            <div class="ticket-item__meta">
              <strong>{{ ticket.sujet }}</strong>
              <p>{{ ticket.categorie }} • {{ ticket.numero }}</p>
            </div>
            <div class="ticket-item__chips">
              <mat-chip [class]="'prio-' + ticket.priorite">{{ priorityKey(ticket.priorite) | translate }}</mat-chip>
              <mat-chip [class]="'status-' + ticket.status">{{ statusLabel(ticket.status) | translate }}</mat-chip>
            </div>
          </div>
        }
      </div>
    </mat-card>
