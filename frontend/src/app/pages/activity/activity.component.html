<app-breadcrumb [items]="['BREADCRUMB.ACCUEIL', 'ACTIVITY.BREADCRUMB']" />
<mat-card class="activity-card">
  <h2>{{ 'ACTIVITY.TITLE' | translate }}</h2>
  <div class="activity-list">
    @for (item of activityList(); track item.title) {
      <div class="activity-item">
        <div>
          <strong>{{ item.title }}</strong>
          <p>{{ item.detail }}</p>
        </div>
        <span>{{ item.time }}</span>
      </div>
    }
  </div>
</mat-card>
